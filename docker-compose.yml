services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rav18
      POSTGRES_USER: rav18
      POSTGRES_PASSWORD: rav18
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rav18 -d rav18"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://rav18:rav18@postgres:5432/rav18
      INCIDENT_STORAGE_DIR: /app/data/incidents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: .
    command: ["python", "-m", "src.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://rav18:rav18@postgres:5432/rav18
      INCIDENT_STORAGE_DIR: /app/data/incidents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
    volumes:
      - ./data:/app/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
